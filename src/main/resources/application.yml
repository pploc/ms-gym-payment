spring:
  application:
    name: ms-gym-payment
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

server:
  port: 8080
  max-http-request-header-size: 8KB

grpc:
  server:
    port: ${GRPC_SERVER_PORT:50051}
    tls:
      enabled: ${PAYMENT_GRPC_TLS_ENABLED:true}
      allow-plaintext: ${PAYMENT_GRPC_ALLOW_PLAINTEXT:false}
      certificate-chain: ${PAYMENT_GRPC_SERVER_CERT:certs/local/server.crt}
      private-key: ${PAYMENT_GRPC_SERVER_KEY:certs/local/server.key}
      client-ca: ${PAYMENT_GRPC_CLIENT_CA:certs/local/ca.crt}

app:
  payment:
    outbox:
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      poll-delay: ${OUTBOX_POLL_DELAY:PT2S}
      retry-delay: ${OUTBOX_RETRY_DELAY:PT10S}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
      lease-duration: ${OUTBOX_LEASE_DURATION:PT1M}
    sepay:
      webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
      account-number: ${SEPAY_ACCOUNT_NUMBER:}
      bank: ${SEPAY_BANK:}
      qr-account: ${SEPAY_QR_ACCOUNT:${SEPAY_ACCOUNT_NUMBER:}}
      qr-bank: ${SEPAY_QR_BANK:${SEPAY_BANK:}}

gym:
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8083}
    value-subject-name-strategy: io.confluent.kafka.serializers.subject.TopicNameStrategy
    auto-register-schemas: ${SCHEMA_AUTO_REGISTER:false}
    publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:PT25S}
    dlq:
      suffix: .DLQ
    retry:
      enabled: true
      retry-count: ${KAFKA_RETRY_COUNT:3}
      initial-interval: ${KAFKA_RETRY_INITIAL_INTERVAL:PT2S}
      multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
      max-interval: ${KAFKA_RETRY_MAX_INTERVAL:PT8S}
